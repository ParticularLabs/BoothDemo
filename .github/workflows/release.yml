name: Release
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - src/Billing/Billing.csproj
          - src/Shipping/Shipping.csproj
          - src/Sales/Sales.csproj
          - src/ClientUI/ClientUI.csproj
          - src/RabbitToAzureBridge/RabbitToAzureBridge.csproj
        runtime:
          - linux-x64
          - linux-arm64   # Raspberry Pi 4 (64-bit)
          # - linux-arm   # uncomment if you need 32-bit Pi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Set project name
        id: vars
        run: |
          name=$(basename "${{ matrix.project }}" .csproj)
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish "${{ matrix.project }}" \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:EnableCompressionInSingleFile=true \
            -o "artifacts/${{ matrix.runtime }}/${{ steps.vars.outputs.name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-${{ steps.vars.outputs.name }}
          path: artifacts/${{ matrix.runtime }}/${{ steps.vars.outputs.name }}

  # Uploaded once rather than from every matrix job, because artifact names must be unique within a run
  files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload scripts
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: scripts/

      - name: Upload Docker stacks
        uses: actions/upload-artifact@v4
        with:
          name: stacks
          path: docker/stacks/
          include-hidden-files: true
