# Local PostgreSQL on the ClientUI Pi, used only by the PostgreSQL transport in the ClientUI robust mode. Orders wait
# here while RabbitMQ on the main Pi is unreachable. ClientUI's default PostgreSqlTransport_ConnectionString matches
# these settings.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-particular}
      POSTGRES_DB: clientui
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Shows the transport's queue tables, e.g. the orders waiting in "Sales" while the cable is unplugged
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-nsb@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-particular}
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:
